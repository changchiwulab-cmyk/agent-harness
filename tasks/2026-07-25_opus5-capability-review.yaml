  F2 .claude/settings.json 只有 9 條 ask、零條 deny——原生 permissions.deny 完全未用，
      deny 目前 100% 依賴 permissions_guard.py 的手寫 regex。
  F4 system/NATIVE_OVERLAP.yaml reviewed_on 停在 2026-05-09（2026-08-07 到期），
      未涵蓋 auto memory、原生 /rewind checkpoint（現表記 0% overlap）、plugins、
      effortLevel、sandbox、擴增後的 hook 事件表。重評後 aggregate 預期越過 50%
      → governance_metrics M4 由 ok 轉 alert → 觸發 T-B。此為誠實重評的預期後果，
      據實呈現；是否啟動 v3 留給使用者決定。
  F5 system/COST_POLICY.md:48-52 的層級註記過期，且成本路由缺 effort 維度。
  F6 Opus 5 四項行為位移（自我驗證/scope 擴張/更傾向委派子代理/產出更長）與現有 prompt 衝突。

  範圍經使用者選定：報告 + P0 修正；F3（hook 覆蓋面）、F8（slash commands）等
  只寫進報告 roadmap，不開卡不實作。prompt 層採「只加不刪 + 移除與腳本重複的自檢句」：
  腳本層驗證（gate_check / verification_loop / GATE_POLICY / CI）完全不動。
  對齊計畫 /root/.claude/plans/opus5-tingly-goose.md。
